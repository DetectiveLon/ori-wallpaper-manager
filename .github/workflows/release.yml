name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: ./scripts/publish.ps1 -Tag "${{ github.ref_name }}"

      - name: Locate package and compute checksum
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifacts -Filter 'oriole-*-win-x64.zip' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) { throw 'No release zip found under artifacts/.' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash
          "path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($zip.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package: $($zip.FullName)"
          Write-Host "SHA-256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: oriole-win-x64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "Portable win-x64 build (framework-dependent; requires the .NET 10 Desktop Runtime).`n`nSHA-256: ${{ steps.package.outputs.sha256 }}`n`nSee RELEASE-NOTES.txt inside the zip."
          gh release create '${{ github.ref_name }}' `
            --title 'Oriole ${{ github.ref_name }}' `
            --notes $notes `
            --verify-tag `
            '${{ steps.package.outputs.path }}'
