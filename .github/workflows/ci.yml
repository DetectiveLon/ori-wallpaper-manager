name: CI

on:
  push:
    branches: [main, v2-shell, "foundation/**", "feature/**", "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"

      - name: Run core tests
        run: dotnet test tests/Ori.Core.Tests/Ori.Core.Tests.csproj --configuration Release

  windows-build:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"

      - name: Restore solution
        run: dotnet restore Ori.sln

      - name: Build solution (app + updater)
        run: dotnet build Ori.sln --configuration Release --no-restore

      - name: Static regression guards
        shell: pwsh
        run: |
          ./scripts/check-tray.ps1 -Strict
          ./scripts/check-theme.ps1
          ./scripts/check-buttons.ps1
          ./scripts/check-invariants.ps1
