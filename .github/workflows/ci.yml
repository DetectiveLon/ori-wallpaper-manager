name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Oriole.sln

      - name: Test core
        run: dotnet test tests/Oriole.Core.Tests/Oriole.Core.Tests.csproj --configuration Release --no-restore

      - name: Build desktop app
        run: dotnet build src/Oriole.Desktop/Oriole.Desktop.csproj --configuration Release --no-restore
